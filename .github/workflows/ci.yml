name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  hub:
    name: Hub (typecheck and tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/hub/package-lock.json
      - run: npm ci
      - name: Typecheck the server and the web app
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p web/tsconfig.json --noEmit
      - name: Tests
        run: npx vitest run
        env:
          CHROME_NO_SANDBOX: "1"

  scheduler:
    name: Instagram scheduler (end-to-end against a mock page)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform/hub/src/scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/hub/src/scheduler/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests (CHROME_PATH is found from the Playwright install; CHROME_NO_SANDBOX for the CI user)
        run: npx vitest run
        env:
          CHROME_NO_SANDBOX: "1"

  remotion:
    name: Remotion project (typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -S warning scripts/*.sh packaging/arch/reel-studio

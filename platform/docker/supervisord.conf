[supervisord]
nodaemon=true
user=root
logfile=/var/log/reel-hub/supervisord.log
pidfile=/tmp/supervisord.pid

[program:display]
command=/bin/bash -c "Xvfb :99 -screen 0 1680x960x24 -nolisten tcp & sleep 1; x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet & exec websockify --web /usr/share/novnc 6080 localhost:5900"
user=%(ENV_HOST_USER)s
priority=10
autorestart=true
stdout_logfile=/var/log/reel-hub/display.log
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:voicestudio]
command=/usr/local/bin/voicestudio-run
user=%(ENV_HOST_USER)s
environment=HOME="%(ENV_HOST_HOME)s"
priority=20
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/reel-hub/voicestudio.log
redirect_stderr=true

[program:hub]
directory=%(ENV_REEL_ROOT)s/platform/hub
command=/bin/bash -c 'if [ -f package.json ]; then h=$(sha1sum package-lock.json 2>/dev/null | cut -d" " -f1); if [ ! -f node_modules/.hub-$h ]; then npm ci || npm install; rm -f node_modules/.hub-*; touch node_modules/.hub-$h; fi; npm run build && exec npm run start; else exec node /opt/placeholder.mjs; fi'
user=%(ENV_HOST_USER)s
environment=HOME="%(ENV_HOST_HOME)s",PORT="4000",HUB_DATA_DIR="/data"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/var/log/reel-hub/hub.log
redirect_stderr=true
stopasgroup=true
killasgroup=true

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

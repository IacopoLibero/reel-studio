# Added by the scripts when STUDIO_HOME is set in .env: the user's files live in one folder outside the program.
#   ${STUDIO_HOME}/workspace  brand/, reels/, mascot/, public/, the reels' own code and the Remotion project (REEL_ROOT inside the container)
#   ${STUDIO_HOME}/data       hub settings, jobs, each brand's data and its Instagram login (HUB_DATA inside the container)
# The repository stays mounted as the program (PROGRAM_ROOT): the hub runs from it and copies its own files into the workspace at every start.
# Mounted at the same absolute path as on the host, like everything else.
services:
  reel-hub:
    environment:
      REEL_ROOT: ${STUDIO_HOME:?}/workspace
      HUB_DATA: ${STUDIO_HOME:?}/data
      REEL_STUDIO_HOME: ${STUDIO_HOME:?}
    volumes:
      - ${STUDIO_HOME:?}:${STUDIO_HOME:?}
      - whisper-cpp:${STUDIO_HOME:?}/workspace/whisper.cpp
      - workspace-node-modules:${STUDIO_HOME:?}/workspace/node_modules

volumes:
  workspace-node-modules:

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">The daily loop</title>
  <desc id="d">Collect results, analyse, propose three ideas, then wait for your approval. Make the reels, then wait for your review of each one. Only then schedule on Instagram.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b93a1"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d94a3d"/></marker>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8eaee; }
    .h { font-size: 20px; font-weight: 700; }
    .s { font-size: 14px; fill: #aab0bb; }
    .n { font-size: 13px; font-weight: 700; fill: #8b93a1; letter-spacing: 1px; }
    .y { font-size: 13px; font-weight: 800; fill: #d94a3d; letter-spacing: 1.5px; }
    .box { fill: #1b1f26; stroke: #3a414d; stroke-width: 1.5; }
    .gate { fill: #2a1b1d; stroke: #d94a3d; stroke-width: 2.5; }
    .ln { stroke: #8b93a1; stroke-width: 1.8; fill: none; }
    .lr { stroke: #d94a3d; stroke-width: 2.4; fill: none; }
  </style>
  <rect width="1200" height="520" rx="20" fill="#0f1216"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="19.5" fill="none" stroke="#2a2f38"/>
  <text class="h" x="40" y="50">The daily loop</text>
  <text class="s" x="40" y="76">Starts once a day after 06:00 (Rome time) when the computer is online. Nothing is made and nothing is scheduled without your click.</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="110" width="250" height="130" rx="14"/>
  <text class="n" x="60" y="138">1  COLLECT</text>
  <text class="s" x="60" y="166">Reads the results of your</text>
  <text class="s" x="60" y="186">reels from Instagram,</text>
  <text class="s" x="60" y="206">read-only, through Composio.</text>

  <rect class="box" x="330" y="110" width="250" height="130" rx="14"/>
  <text class="n" x="350" y="138">2  ANALYSE</text>
  <text class="s" x="350" y="166">A plain-language readout:</text>
  <text class="s" x="350" y="186">what to repeat, what to stop.</text>
  <text class="s" x="350" y="206">Improvement proposals.</text>

  <rect class="box" x="620" y="110" width="250" height="130" rx="14"/>
  <text class="n" x="640" y="138">3  IDEAS</text>
  <text class="s" x="640" y="166">Three new reel questions,</text>
  <text class="s" x="640" y="186">each with a reason from your</text>
  <text class="s" x="640" y="206">data. A desktop alert is sent.</text>

  <rect class="gate" x="910" y="110" width="250" height="130" rx="14"/>
  <text class="y" x="930" y="138">YOU DECIDE</text>
  <text class="h" x="930" y="168">Approval 1</text>
  <text class="s" x="930" y="192">Pick ideas, set the closing,</text>
  <text class="s" x="930" y="212">press "Create selected" or Skip.</text>

  <path class="ln" d="M290 175 H328" marker-end="url(#a)"/>
  <path class="ln" d="M580 175 H618" marker-end="url(#a)"/>
  <path class="ln" d="M870 175 H908" marker-end="url(#a)"/>

  <!-- elbow from approval 1 to row 2 -->
  <path class="lr" d="M1035 240 V268 H165 V298" marker-end="url(#r)"/>

  <!-- row 2 -->
  <rect class="box" x="40" y="300" width="250" height="130" rx="14"/>
  <text class="n" x="60" y="328">4  MAKE THE REELS</text>
  <text class="s" x="60" y="356">One job per idea: script, voice,</text>
  <text class="s" x="60" y="376">motion graphics, render,</text>
  <text class="s" x="60" y="396">caption and cover.</text>

  <rect class="gate" x="330" y="300" width="250" height="130" rx="14"/>
  <text class="y" x="350" y="328">YOU DECIDE</text>
  <text class="h" x="350" y="358">Approval 2</text>
  <text class="s" x="350" y="382">Watch each reel. Confirm,</text>
  <text class="s" x="350" y="402">or Reject with a note (2 reruns).</text>

  <rect class="box" x="620" y="300" width="250" height="130" rx="14"/>
  <text class="n" x="640" y="328">5  SCHEDULE</text>
  <text class="s" x="640" y="356">Next free slot of your pattern,</text>
  <text class="s" x="640" y="376">one browser job at a time,</text>
  <text class="s" x="640" y="396">9:16, at least 20 min ahead.</text>

  <rect class="box" x="910" y="300" width="250" height="130" rx="14"/>
  <text class="n" x="930" y="328">6  VERIFY</text>
  <text class="s" x="930" y="356">The post is checked on the</text>
  <text class="s" x="930" y="376">Instagram calendar and shows</text>
  <text class="s" x="930" y="396">in the Calendar page.</text>

  <path class="ln" d="M290 365 H328" marker-end="url(#a)"/>
  <path class="lr" d="M580 365 H618" marker-end="url(#r)"/>
  <path class="ln" d="M870 365 H908" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="40" y="470" width="22" height="16" rx="4" fill="#2a1b1d" stroke="#d94a3d" stroke-width="2"/>
  <text class="s" x="72" y="483">A manual approval. The loop stops here until you click.</text>
  <rect x="520" y="470" width="22" height="16" rx="4" fill="#1b1f26" stroke="#3a414d" stroke-width="1.5"/>
  <text class="s" x="552" y="483">An automatic step, shown as a job with a progress bar.</text>
</svg>
